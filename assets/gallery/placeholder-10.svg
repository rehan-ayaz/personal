<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 1000" width="740" height="1000">
  <defs>
    <linearGradient id="bgGrad_10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A20"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0E0F13"/>
    </linearGradient>
    <radialGradient id="glowGrad_10" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C2FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridDots_10" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Base Card Background -->
  <rect width="740" height="1000" rx="14" fill="url(#bgGrad_10)"/>
  <rect width="740" height="1000" rx="14" fill="url(#gridDots_10)"/>
  
  <!-- Subtle Radial Glow behind Center Icon -->
  <circle cx="370" cy="470" r="259" fill="url(#glowGrad_10)"/>

  <!-- Card Border -->
  <rect x="1.5" y="1.5" width="737" height="997" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5"/>

  <!-- Viewfinder Corner Crop Marks -->
  <g stroke="#00C2FF" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- Top-Left -->
    <path d="M 28 46 L 28 28 L 46 28"/>
    <!-- Top-Right -->
    <path d="M 694 28 L 712 28 L 712 46"/>
    <!-- Bottom-Left -->
    <path d="M 28 954 L 28 972 L 46 972"/>
    <!-- Bottom-Right -->
    <path d="M 694 972 L 712 972 L 712 954"/>
  </g>

  <!-- Top Bar: Index & Category Chip -->
  <text x="60" y="66" font-family="'DM Sans', sans-serif" font-size="18" font-weight="700" fill="#00C2FF" letter-spacing="2">#10</text>
  
  <!-- Category Pill -->
  <g transform="translate(530, 44)">
    <rect width="150" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(0, 194, 255, 0.35)" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#00C2FF"/>
    <text x="32" y="21" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">SOLITUDE</text>
  </g>

  <!-- Center Artwork / Icon Container -->
  <g transform="translate(322, 370) scale(4)">
    <!-- Icon Circle Ring -->
    <circle cx="12" cy="12" r="18" fill="rgba(0, 194, 255, 0.08)" stroke="rgba(0, 194, 255, 0.28)" stroke-width="1"/>
    <circle cx="12" cy="12" r="10" stroke="#00C2FF" stroke-width="2" fill="none"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" stroke="#00C2FF" stroke-width="2" fill="none"/>
  </g>

  <!-- Title & Description -->
  <text x="370" y="585" text-anchor="middle" font-family="'Marcellus', serif" font-size="38" font-weight="400" fill="#FFFFFF" letter-spacing="-0.5">Stargazing Camps</text>
  <text x="370" y="625" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Campfires under unpolluted night skies</text>

  <!-- Bottom Bar: Metadata -->
  <line x1="44" y1="932" x2="696" y2="932" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="60" y="958" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="1.5">PHOTO PLACEHOLDER</text>
  <text x="680" y="958" text-anchor="end" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#00C2FF" letter-spacing="1">MOMENT 10 / 11</text>
</svg>