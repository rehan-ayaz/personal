<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1000" width="1620" height="1000">
  <defs>
    <linearGradient id="bgGrad_07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A20"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0E0F13"/>
    </linearGradient>
    <radialGradient id="glowGrad_07" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C2FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridDots_07" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Base Card Background -->
  <rect width="1620" height="1000" rx="14" fill="url(#bgGrad_07)"/>
  <rect width="1620" height="1000" rx="14" fill="url(#gridDots_07)"/>
  
  <!-- Subtle Radial Glow behind Center Icon -->
  <circle cx="810" cy="470" r="567" fill="url(#glowGrad_07)"/>

  <!-- Card Border -->
  <rect x="1.5" y="1.5" width="1617" height="997" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5"/>

  <!-- Viewfinder Corner Crop Marks -->
  <g stroke="#00C2FF" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- Top-Left -->
    <path d="M 28 46 L 28 28 L 46 28"/>
    <!-- Top-Right -->
    <path d="M 1574 28 L 1592 28 L 1592 46"/>
    <!-- Bottom-Left -->
    <path d="M 28 954 L 28 972 L 46 972"/>
    <!-- Bottom-Right -->
    <path d="M 1574 972 L 1592 972 L 1592 954"/>
  </g>

  <!-- Top Bar: Index & Category Chip -->
  <text x="60" y="66" font-family="'DM Sans', sans-serif" font-size="18" font-weight="700" fill="#00C2FF" letter-spacing="2">#07</text>
  
  <!-- Category Pill -->
  <g transform="translate(1410, 44)">
    <rect width="150" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(0, 194, 255, 0.35)" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#00C2FF"/>
    <text x="32" y="21" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">NETWORK</text>
  </g>

  <!-- Center Artwork / Icon Container -->
  <g transform="translate(762, 370) scale(4)">
    <!-- Icon Circle Ring -->
    <circle cx="12" cy="12" r="18" fill="rgba(0, 194, 255, 0.08)" stroke="rgba(0, 194, 255, 0.28)" stroke-width="1"/>
    <path d="M17 21V19C17 16.7909 15.2091 15 13 15H5C2.79086 15 1 16.7909 1 19V21M9 11C11.2091 11 13 9.20914 13 7C13 4.79086 11.2091 3 9 3C6.79086 3 5 4.79086 5 7C5 9.20914 6.79086 11 9 11ZM23 21V19C22.9986 17.1771 21.765 15.5857 20 15.13M16 3.13C17.7699 3.58317 19.0078 5.17799 19.0078 7.005C19.0078 8.83201 17.7699 10.4268 16 10.88" stroke="#00C2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Title & Description -->
  <text x="810" y="585" text-anchor="middle" font-family="'Marcellus', serif" font-size="48" font-weight="400" fill="#FFFFFF" letter-spacing="-0.5">Tech Meetups</text>
  <text x="810" y="625" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="22" font-weight="400" fill="#94A3B8">Sharing ideas &amp; builder sessions</text>

  <!-- Bottom Bar: Metadata -->
  <line x1="44" y1="932" x2="1576" y2="932" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="60" y="958" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="1.5">PHOTO PLACEHOLDER</text>
  <text x="1560" y="958" text-anchor="end" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#00C2FF" letter-spacing="1">MOMENT 07 / 11</text>
