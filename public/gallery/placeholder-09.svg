<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1000" width="1340" height="1000">
  <defs>
    <linearGradient id="bgGrad_09" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A20"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0E0F13"/>
    </linearGradient>
    <radialGradient id="glowGrad_09" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C2FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridDots_09" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Base Card Background -->
  <rect width="1340" height="1000" rx="14" fill="url(#bgGrad_09)"/>
  <rect width="1340" height="1000" rx="14" fill="url(#gridDots_09)"/>
  
  <!-- Subtle Radial Glow behind Center Icon -->
  <circle cx="670" cy="470" r="468.99999999999994" fill="url(#glowGrad_09)"/>

  <!-- Card Border -->
  <rect x="1.5" y="1.5" width="1337" height="997" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5"/>

  <!-- Viewfinder Corner Crop Marks -->
  <g stroke="#00C2FF" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- Top-Left -->
    <path d="M 28 46 L 28 28 L 46 28"/>
    <!-- Top-Right -->
    <path d="M 1294 28 L 1312 28 L 1312 46"/>
    <!-- Bottom-Left -->
    <path d="M 28 954 L 28 972 L 46 972"/>
    <!-- Bottom-Right -->
    <path d="M 1294 972 L 1312 972 L 1312 954"/>
  </g>

  <!-- Top Bar: Index & Category Chip -->
  <text x="60" y="66" font-family="'DM Sans', sans-serif" font-size="18" font-weight="700" fill="#00C2FF" letter-spacing="2">#09</text>
  
  <!-- Category Pill -->
  <g transform="translate(1130, 44)">
    <rect width="150" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(0, 194, 255, 0.35)" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#00C2FF"/>
    <text x="32" y="21" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">CRAFT</text>
  </g>

  <!-- Center Artwork / Icon Container -->
  <g transform="translate(622, 370) scale(4)">
    <!-- Icon Circle Ring -->
    <circle cx="12" cy="12" r="18" fill="rgba(0, 194, 255, 0.08)" stroke="rgba(0, 194, 255, 0.28)" stroke-width="1"/>
    <rect x="4" y="4" width="16" height="16" rx="2" stroke="#00C2FF" stroke-width="2" fill="none"/><rect x="8" y="8" width="8" height="8" rx="1" stroke="#00C2FF" stroke-width="1.5" fill="none"/><path d="M9 1V4M15 1V4M9 20V23M15 20V23M20 9H23M20 15H23M1 9H4M1 15H4" stroke="#00C2FF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title & Description -->
  <text x="670" y="585" text-anchor="middle" font-family="'Marcellus', serif" font-size="47" font-weight="400" fill="#FFFFFF" letter-spacing="-0.5">Custom Keyboards</text>
  <text x="670" y="625" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="22" font-weight="400" fill="#94A3B8">Lubed switches, PCBs &amp; brass plates</text>

  <!-- Bottom Bar: Metadata -->
  <line x1="44" y1="932" x2="1296" y2="932" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="60" y="958" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="1.5">PHOTO PLACEHOLDER</text>
  <text x="1280" y="958" text-anchor="end" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#00C2FF" letter-spacing="1">MOMENT 09 / 11</text>
</svg>