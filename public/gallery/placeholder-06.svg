<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1000" width="780" height="1000">
  <defs>
    <linearGradient id="bgGrad_06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A20"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0E0F13"/>
    </linearGradient>
    <radialGradient id="glowGrad_06" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C2FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridDots_06" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Base Card Background -->
  <rect width="780" height="1000" rx="14" fill="url(#bgGrad_06)"/>
  <rect width="780" height="1000" rx="14" fill="url(#gridDots_06)"/>
  
  <!-- Subtle Radial Glow behind Center Icon -->
  <circle cx="390" cy="470" r="273" fill="url(#glowGrad_06)"/>

  <!-- Card Border -->
  <rect x="1.5" y="1.5" width="777" height="997" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5"/>

  <!-- Viewfinder Corner Crop Marks -->
  <g stroke="#00C2FF" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- Top-Left -->
    <path d="M 28 46 L 28 28 L 46 28"/>
    <!-- Top-Right -->
    <path d="M 734 28 L 752 28 L 752 46"/>
    <!-- Bottom-Left -->
    <path d="M 28 954 L 28 972 L 46 972"/>
    <!-- Bottom-Right -->
    <path d="M 734 972 L 752 972 L 752 954"/>
  </g>

  <!-- Top Bar: Index & Category Chip -->
  <text x="60" y="66" font-family="'DM Sans', sans-serif" font-size="18" font-weight="700" fill="#00C2FF" letter-spacing="2">#06</text>
  
  <!-- Category Pill -->
  <g transform="translate(570, 44)">
    <rect width="150" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(0, 194, 255, 0.35)" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#00C2FF"/>
    <text x="32" y="21" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">SOUNDSCAPES</text>
  </g>

  <!-- Center Artwork / Icon Container -->
  <g transform="translate(342, 370) scale(4)">
    <!-- Icon Circle Ring -->
    <circle cx="12" cy="12" r="18" fill="rgba(0, 194, 255, 0.08)" stroke="rgba(0, 194, 255, 0.28)" stroke-width="1"/>
    <circle cx="12" cy="12" r="10" stroke="#00C2FF" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3" stroke="#00C2FF" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="6" stroke="#00C2FF" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
  </g>

  <!-- Title & Description -->
  <text x="390" y="585" text-anchor="middle" font-family="'Marcellus', serif" font-size="38" font-weight="400" fill="#FFFFFF" letter-spacing="-0.5">Vinyl &amp; Lo-Fi</text>
  <text x="390" y="625" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Analog warm tones on spin</text>

  <!-- Bottom Bar: Metadata -->
  <line x1="44" y1="932" x2="736" y2="932" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="60" y="958" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="1.5">PHOTO PLACEHOLDER</text>
  <text x="720" y="958" text-anchor="end" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#00C2FF" letter-spacing="1">MOMENT 06 / 11</text>
</svg>