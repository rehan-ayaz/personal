<!doctype html>
<html lang="en" data-ax-route="auth/lock-screen-basic">
<head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- ============================================================ -->
<!-- REHAN AYAZ CMS ANTI-FLASH THEME RESTORE — MUST be first executable    -->
<!-- in <head>, before any stylesheet. Runs synchronously (~1ms), -->
<!-- reads ax: localStorage, resolves system theme via matchMedia,-->
<!-- and writes all data-ax-* + dir + lang on <html> before paint.-->
<!-- Framework-agnostic IIFE; try/catch so storage never blocks.  -->
<!-- ============================================================ -->
<script>
/* Vireo anti-flash — must be FIRST in <head>, before stylesheets. */
(function () {
  var D = document.documentElement, LS;
  try { LS = window.localStorage; } catch (e) { LS = null; }
  function get(k){ try { return LS && LS.getItem(k); } catch(e){ return null; } }

  /* schema guard: wipe unknown shape, never throw */
  try { if (LS && get('ax:schema') && get('ax:schema') !== '1') {
    Object.keys(LS).forEach(function(k){ if (k.indexOf('ax:')===0) LS.removeItem(k); });
  } if (LS) LS.setItem('ax:schema','1'); } catch(e){}

  /* ---- THEME (light | dark | system) ---- */
  var theme = get('ax:theme') || 'system';
  var sysDark = false;
  try { sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){}
  var resolved = (theme === 'system') ? (sysDark ? 'dark' : 'light') : theme;
  D.setAttribute('data-ax-theme', resolved);  /* always written so CSS [data-ax-theme] selectors match */

  /* ---- ACCENT ---- */
  var accent = get('ax:accent') || 'verdigris';
  if (accent === 'verdigris') D.removeAttribute('data-ax-accent');
  else D.setAttribute('data-ax-accent', accent);

  /* ---- FONT (any Google family; the default, Inter, needs no attr + no link) ----
     Mirrors js/core/fonts.js. Injected here rather than after boot so the face
     is already in flight when the first paint happens — otherwise every page
     load would flash Inter before swapping. A family chosen in the customizer
     rides an INLINE --ax-font-sans, exactly as the custom accent colour does;
     its weight ramp was resolved from the Google Fonts catalog at pick time and
     persisted, because this script must rebuild the same URL without being able
     to load that catalog. */
  var fontFamily = (get('ax:font') === 'custom') ? get('ax:font-custom') : null;
  if (fontFamily) {
    D.setAttribute('data-ax-font', 'custom');
    D.style.setProperty('--ax-font-sans', '"' + fontFamily + '", ui-sans-serif, system-ui, sans-serif');
    var fl = document.createElement('link');
    fl.id = 'ax-font-link'; fl.rel = 'stylesheet';
    fl.href = 'https://fonts.googleapis.com/css2?family=' + fontFamily.replace(/ /g, '+') +
              (get('ax:font-weights') || ':wght@400;500;600;700') + '&display=swap';
    document.head.appendChild(fl);
  } else { D.removeAttribute('data-ax-font'); }

  /* ---- LANG + DIR ---- */
  var lang = (get('ax:lang') || 'EN').toUpperCase();
  D.setAttribute('lang', lang.toLowerCase());                 /* EN -> en */
  var dirStored = get('ax:dir');                              /* explicit wins */
  var dir = dirStored ? dirStored : (lang === 'AR' ? 'rtl' : 'ltr');
  D.setAttribute('dir', dir);

  /* ---- LAYOUT / SCHEME attributes (write only non-defaults; keep DOM clean) ---- */
  function setAttr(attr, key, def){
    var v = get(key);
    if (v && v !== def) D.setAttribute(attr, v); else D.removeAttribute(attr);
  }
  setAttr('data-ax-nav',              'ax:nav',              'vertical');
  setAttr('data-ax-shell-style',      'ax:shell-style',      'default');
  setAttr('data-ax-sidebar-behavior', 'ax:sidebar-behavior', 'collapsible');
  setAttr('data-ax-menu',             'ax:menu',             'click');
  setAttr('data-ax-page',             'ax:page',             'regular');
  setAttr('data-ax-width',            'ax:width',            'fluid');
  setAttr('data-ax-header-position',  'ax:header-position',  'fixed');
  setAttr('data-ax-sidebar-position', 'ax:sidebar-position', 'fixed');
  setAttr('data-ax-sidebar',          'ax:sidebar-scheme',   'light');
  setAttr('data-ax-header',           'ax:header-scheme',    'light');
  setAttr('data-ax-sidebar-image',    'ax:sidebar-image',    'none');
  setAttr('data-ax-loader',           'ax:loader',           'on');

  /* ---- COLLAPSED RAIL (header toggle; boolean presence, default expanded) ----
     Only honoured in the 'collapsible' behavior. 'expanded'/'compact' lock the
     rail (compact renders the icon rail via [data-ax-sidebar-behavior]), so the
     persisted toggle must not re-collapse over them. */
  var behavior = get('ax:sidebar-behavior') || 'collapsible';
  if (behavior === 'collapsible' && get('ax:collapsed') === '1') D.setAttribute('data-ax-collapsed', '');
  else D.removeAttribute('data-ax-collapsed');

  /* ---- CUSTOM COLOR PICKERS (inline style; re-derive ramp deterministically) ---- */
  var customAccent = get('ax:accent-custom');
  if (accent === 'custom' && customAccent) {
    /* full ramp derivation lives in customizer module; head script sets at least
       --ax-accent + --ax-on-accent so first paint is correct. */
    D.style.setProperty('--ax-accent', customAccent);
    /* on-accent by luminance (sRGB approx) */
    var h = customAccent.replace('#','');
    var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
    var L = (0.2126*r + 0.7152*g + 0.0722*b)/255;
    D.style.setProperty('--ax-on-accent', L > 0.62 ? '#1F1602' : '#FFFFFF');
    D.setAttribute('data-ax-accent','custom');
  }
  var bg = get(resolved === 'dark' ? 'ax:bg-custom-dark' : 'ax:bg-custom');
  if (bg) D.style.setProperty('--ax-canvas', bg);
})();
</script>

<title>Lock Screen — Basic · Rehan Ayaz CMS</title>
<meta name="description" content="Rehan Ayaz Portfolio Website CMS — Manage Pages, Blog, Projects, SEO, and Inquiries" />
<meta name="theme-color" content="#0A0C11" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#FCFBF9" media="(prefers-color-scheme: light)" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon-BNwXwd9x.svg" />
<link rel="alternate icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

<!-- Google Fonts — Inter (sans) · Space Grotesk (display) · JetBrains Mono (mono) · token brief §7.1 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
  rel="stylesheet"
/>

<!-- Compiled application stylesheet (token chain + Tailwind v4 @theme bridge + shell/components) -->
  <script type="module" crossorigin src="/assets/vireo-BKePweWV.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/vireo-D45lZWjH.css">
</head>
<body class="ax-standalone">
  <!-- Page preloader — full-screen overlay removed on boot by vireo.js hideLoader().
       The customizer "Page loader" toggle writes data-ax-loader="off" to suppress it
       ([data-ax-loader='off'] .ax-loader { display:none }). Reuses the existing
       .ax-spinner component; no bespoke loader CSS. -->
  <div class="ax-loader" data-ax-loader-el role="status" aria-live="polite" aria-label="Loading">
    <span class="ax-spinner ax-spinner--lg" aria-hidden="true"><span class="ax-spinner__glyph"></span></span>
  </div>
  <style>
    @keyframes ax-spin-local { to { transform: rotate(360deg); } }
    .ax-spin { animation: ax-spin-local 0.7s var(--ax-ease-linear) infinite; }
    @media (prefers-reduced-motion: reduce) { .ax-spin { animation: none; } }
  </style>
  <div class="ax-ambient" aria-hidden="true"><i></i></div>

  <!-- ════ OFF-APP TOOLS ════ -->
  <div class="ax-cluster" style="position:fixed;inset-block-start:var(--ax-space-5);inset-inline-end:var(--ax-space-6);z-index:5;gap:var(--ax-space-2);">
    <button type="button" class="ax-btn ax-btn--ghost ax-btn--icon" aria-label="Toggle color theme"
            x-data @click="$store.theme && $store.theme.toggle()">
      <svg class="ax-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454l0 .008"/></svg>
    </button>
    <button type="button" class="ax-btn ax-btn--ghost ax-btn--sm">
      <svg class="ax-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M3.6 9h16.8"/><path d="M3.6 15h16.8"/><path d="M11.5 3a17 17 0 0 0 0 18"/><path d="M12.5 3a17 17 0 0 1 0 18"/></svg>
      <span class="ax-btn__label">EN</span>
    </button>
  </div>

  <main class="ax-center" id="ax-main" style="position:relative;z-index:1;width:100%;">
    <div style="width:100%;max-width:400px;">
      <!-- brand -->
      <div class="ax-center" style="margin-block-end:var(--ax-space-6);">
        <a href="/src/html/index.html" class="ax-cluster" style="gap:var(--ax-space-3);text-decoration:none;" aria-label="Rehan Ayaz CMS home">
          <span style="display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--ax-radius-md);background:var(--ax-gradient-accent);color:var(--ax-on-accent);box-shadow:0 8px 22px -8px rgba(var(--ax-accent-rgb),.7);">
            <svg viewBox="0 0 32 32" width="23" height="23" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="axmk0" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#2BC4B0"/><stop offset="0.55" stop-color="#1E9E96"/><stop offset="1" stop-color="#6D5CF0"/></linearGradient></defs><path d="M4 4 H16 A12 12 0 0 1 28 16 V28 A0 0 0 0 1 28 28 H16 A12 12 0 0 1 4 16 V4 Z" fill="url(#axmk0)" stroke="none"/><circle cx="20.5" cy="11.5" r="2.6" fill="#0A0C11" fill-opacity="0.92" stroke="none"/></svg>
          </span>
          <b style="font-family:var(--ax-font-display);font-size:var(--ax-text-lg);color:var(--ax-text-strong);">Vireo</b>
        </a>
      </div>

      <!-- card -->
      <div class="ax-card" x-data="lockScreen()">
        <div class="ax-card__body" style="padding:var(--ax-space-8);">

          <!-- identity -->
          <div class="ax-center" style="text-align:center;margin-block-end:var(--ax-space-6);">
            <span class="ax-avatar" style="width:72px;height:72px;font-size:26px;border-radius:var(--ax-radius-pill);background:var(--ax-accent-wash);color:var(--ax-accent);box-shadow:0 0 0 3px var(--ax-surface),0 0 0 4px rgba(var(--ax-accent-rgb),.35);margin-block-end:var(--ax-space-4);">
              <span class="ax-avatar__initials">AS</span>
            </span>
            <h1 style="font-family:var(--ax-font-display);font-size:var(--ax-text-lg);font-weight:600;color:var(--ax-text-strong);margin:0;letter-spacing:-.01em;">Ava Sutton</h1>
            <p style="font-size:var(--ax-text-sm);color:var(--ax-text-muted);margin:var(--ax-space-1) 0 0;">Session locked · last active <span class="ax-num">14 min</span> ago</p>
          </div>

          <!-- error banner -->
          <div x-show="error" x-cloak x-transition class="ax-alert ax-alert--danger" role="alert" style="margin-block-end:var(--ax-space-5);">
            <svg class="ax-alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"/><path d="M12 16h.01"/><path d="M5.07 19h13.86a2 2 0 0 0 1.73 -3l-6.93 -12a2 2 0 0 0 -3.46 0l-6.93 12a2 2 0 0 0 1.73 3"/></svg>
            <div class="ax-alert__content"><p class="ax-alert__message" x-text="error"></p></div>
          </div>

          <form class="ax-stack" @submit.prevent="unlock()" novalidate>
            <div class="ax-field">
              <label class="ax-label" for="lock-pw">Password</label>
              <div class="ax-field__control">
                <input id="lock-pw" class="ax-input ax-input--with-trailing" :type="reveal?'text':'password'"
                       autocomplete="current-password" placeholder="Enter your password to unlock"
                       x-model="pw" x-ref="pw" :aria-invalid="invalid" @input="invalid=false;error=''" />
                <button type="button" class="ax-field__affix ax-field__affix--trailing ax-field__affix--button"
                        :aria-pressed="reveal" :aria-label="reveal?'Hide password':'Show password'" @click="reveal=!reveal">
                  <svg x-show="!reveal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"/></svg>
                  <svg x-show="reveal" x-cloak viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828"/><path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87"/><path d="M3 3l18 18"/></svg>
                </button>
              </div>
            </div>

            <button type="submit" class="ax-btn ax-btn--primary ax-btn--block" :aria-busy="loading" :disabled="loading" style="margin-block-start:var(--ax-space-2);min-height:44px;">
              <svg x-show="loading" x-cloak class="ax-btn__icon ax-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
              <svg x-show="!loading" class="ax-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6"/><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"/><path d="M8 11v-4a4 4 0 1 1 8 0v4"/></svg>
              <span class="ax-btn__label" x-text="loading ? 'Unlocking…' : 'Unlock'"></span>
            </button>
          </form>

          <p style="margin-block-start:var(--ax-space-5);text-align:center;font-size:var(--ax-text-sm);color:var(--ax-text-muted);">
            Not Ava? <a class="ax-link" href="/src/html/auth/sign-in-basic.html">Sign in as another user</a>
          </p>
        </div>
      </div>

      <p style="margin-block-start:var(--ax-space-5);text-align:center;font-size:var(--ax-text-2xs);color:var(--ax-text-subtle);">
        Protected workspace · Rehan Ayaz CMS keeps your session encrypted while you're away.
      </p>
    </div>
  </main>

  <!-- ============================================================ -->
  <!-- CMS RUNTIME — single ES module entry.                      -->
  <!-- Boots Alpine + plugins, registers shell components           -->
  <!-- (axShell, axSidebar, axHeader, axDropdown, axCommand,        -->
  <!-- axCustomizer), fetches /src/data/nav-manifest.json, and      -->
  <!-- wires active-trail, breadcrumb, command palette, theme.      -->
  <!-- ============================================================ -->
  
  <!-- Per-page hook (optional):
       Pages that need extra behavior (charts, datatables, editors) add a
       deferred module AFTER this line, e.g.:
       <script type="module" src="/src/js/pages/dashboards-sales.js"></script>
       Keep page scripts deferred/module so they run after vireo.js boots. -->
  <script>
    function lockScreen() {
      return {
        pw:'', reveal:false, loading:false, error:'', invalid:false, attempts:0,
        unlock(){
          this.error='';
          if(!this.pw){ this.invalid=true; this.error='Please enter your password.'; this.$refs.pw.focus(); return; }
          this.loading=true;
          setTimeout(()=>{
            this.loading=false;
            // demo password: "vireo"
            if(this.pw==='vireo'){ window.location.href='/src/html/index.html'; }
            else {
              this.attempts++; this.invalid=true;
              this.error = this.attempts>=3 ? 'Too many attempts. Locked for 30 seconds.' : 'Incorrect password. Please try again.';
              this.$refs.pw.focus();
            }
          },600);
        }
      };
    }
  </script>
</body>
</html>
