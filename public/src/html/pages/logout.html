<!-- ============================================================ -->
<!-- REHAN AYAZ CMS ANTI-FLASH THEME RESTORE — MUST be first executable    -->
<!-- in <head>, before any stylesheet. Runs synchronously (~1ms), -->
<!-- reads ax: localStorage, resolves system theme via matchMedia,-->
<!-- and writes all data-ax-* + dir + lang on <html> before paint.-->
<!-- Framework-agnostic IIFE; try/catch so storage never blocks.  -->
<!-- ============================================================ -->
<script>
/* Vireo anti-flash — must be FIRST in <head>, before stylesheets. */
(function () {
  var D = document.documentElement, LS;
  try { LS = window.localStorage; } catch (e) { LS = null; }
  function get(k){ try { return LS && LS.getItem(k); } catch(e){ return null; } }

  /* schema guard: wipe unknown shape, never throw */
  try { if (LS && get('ax:schema') && get('ax:schema') !== '1') {
    Object.keys(LS).forEach(function(k){ if (k.indexOf('ax:')===0) LS.removeItem(k); });
  } if (LS) LS.setItem('ax:schema','1'); } catch(e){}

  /* ---- THEME (light | dark | system) ---- */
  var theme = get('ax:theme') || 'system';
  var sysDark = false;
  try { sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){}
  var resolved = (theme === 'system') ? (sysDark ? 'dark' : 'light') : theme;
  D.setAttribute('data-ax-theme', resolved);  /* always written so CSS [data-ax-theme] selectors match */

  /* ---- ACCENT ---- */
  var accent = get('ax:accent') || 'verdigris';
  if (accent === 'verdigris') D.removeAttribute('data-ax-accent');
  else D.setAttribute('data-ax-accent', accent);

  /* ---- FONT (any Google family; the default, Inter, needs no attr + no link) ----
     Mirrors js/core/fonts.js. Injected here rather than after boot so the face
     is already in flight when the first paint happens — otherwise every page
     load would flash Inter before swapping. A family chosen in the customizer
     rides an INLINE --ax-font-sans, exactly as the custom accent colour does;
     its weight ramp was resolved from the Google Fonts catalog at pick time and
     persisted, because this script must rebuild the same URL without being able
     to load that catalog. */
  var fontFamily = (get('ax:font') === 'custom') ? get('ax:font-custom') : null;
  if (fontFamily) {
    D.setAttribute('data-ax-font', 'custom');
    D.style.setProperty('--ax-font-sans', '"' + fontFamily + '", ui-sans-serif, system-ui, sans-serif');
    var fl = document.createElement('link');
    fl.id = 'ax-font-link'; fl.rel = 'stylesheet';
    fl.href = 'https://fonts.googleapis.com/css2?family=' + fontFamily.replace(/ /g, '+') +
              (get('ax:font-weights') || ':wght@400;500;600;700') + '&display=swap';
    document.head.appendChild(fl);
  } else { D.removeAttribute('data-ax-font'); }

  /* ---- LANG + DIR ---- */
  var lang = (get('ax:lang') || 'EN').toUpperCase();
  D.setAttribute('lang', lang.toLowerCase());                 /* EN -> en */
  var dirStored = get('ax:dir');                              /* explicit wins */
  var dir = dirStored ? dirStored : (lang === 'AR' ? 'rtl' : 'ltr');
  D.setAttribute('dir', dir);

  /* ---- LAYOUT / SCHEME attributes (write only non-defaults; keep DOM clean) ---- */
  function setAttr(attr, key, def){
    var v = get(key);
    if (v && v !== def) D.setAttribute(attr, v); else D.removeAttribute(attr);
  }
  setAttr('data-ax-nav',              'ax:nav',              'vertical');
  setAttr('data-ax-shell-style',      'ax:shell-style',      'default');
  setAttr('data-ax-sidebar-behavior', 'ax:sidebar-behavior', 'collapsible');
  setAttr('data-ax-menu',             'ax:menu',             'click');
  setAttr('data-ax-page',             'ax:page',             'regular');
  setAttr('data-ax-width',            'ax:width',            'fluid');
  setAttr('data-ax-header-position',  'ax:header-position',  'fixed');
  setAttr('data-ax-sidebar-position', 'ax:sidebar-position', 'fixed');
  setAttr('data-ax-sidebar',          'ax:sidebar-scheme',   'light');
  setAttr('data-ax-header',           'ax:header-scheme',    'light');
  setAttr('data-ax-sidebar-image',    'ax:sidebar-image',    'none');
  setAttr('data-ax-loader',           'ax:loader',           'on');

  /* ---- COLLAPSED RAIL (header toggle; boolean presence, default expanded) ----
     Only honoured in the 'collapsible' behavior. 'expanded'/'compact' lock the
     rail (compact renders the icon rail via [data-ax-sidebar-behavior]), so the
     persisted toggle must not re-collapse over them. */
  var behavior = get('ax:sidebar-behavior') || 'collapsible';
  if (behavior === 'collapsible' && get('ax:collapsed') === '1') D.setAttribute('data-ax-collapsed', '');
  else D.removeAttribute('data-ax-collapsed');

  /* ---- CUSTOM COLOR PICKERS (inline style; re-derive ramp deterministically) ---- */
  var customAccent = get('ax:accent-custom');
  if (accent === 'custom' && customAccent) {
    /* full ramp derivation lives in customizer module; head script sets at least
       --ax-accent + --ax-on-accent so first paint is correct. */
    D.style.setProperty('--ax-accent', customAccent);
    /* on-accent by luminance (sRGB approx) */
    var h = customAccent.replace('#','');
    var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
    var L = (0.2126*r + 0.7152*g + 0.0722*b)/255;
    D.style.setProperty('--ax-on-accent', L > 0.62 ? '#1F1602' : '#FFFFFF');
    D.setAttribute('data-ax-accent','custom');
  }
  var bg = get(resolved === 'dark' ? 'ax:bg-custom-dark' : 'ax:bg-custom');
  if (bg) D.style.setProperty('--ax-canvas', bg);
})();
</script>

<body class="ax-standalone" data-ax-layout="status">

       .ax-spinner component; no bespoke loader CSS. -->

    <span class="ax-spinner ax-spinner--lg" aria-hidden="true"><span class="ax-spinner__glyph"></span></span>
  </div>
  <div class="ax-ambient" aria-hidden="true"><i></i></div>

        <span aria-hidden="true" style="display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--ax-radius-md);background:var(--ax-gradient-accent);color:var(--ax-on-accent);box-shadow:0 8px 22px -8px rgba(var(--ax-accent-rgb),.7);">
          <svg viewBox="0 0 32 32" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="axmk0" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#2BC4B0"/><stop offset="0.55" stop-color="#1E9E96"/><stop offset="1" stop-color="#6D5CF0"/></linearGradient></defs><path d="M4 4 H16 A12 12 0 0 1 28 16 V28 A0 0 0 0 1 28 28 H16 A12 12 0 0 1 4 16 V4 Z" fill="url(#axmk0)" stroke="none"/><circle cx="20.5" cy="11.5" r="2.6" fill="#0A0C11" fill-opacity="0.92" stroke="none"/></svg>
        </span>
        <span style="font-family:var(--ax-font-display);font-weight:600;font-size:var(--ax-text-lg);color:var(--ax-text-strong);letter-spacing:.01em;">Vireo</span>
      </a>

      <!-- signed-out card -->
      <div class="ax-glass" style="width:100%;border-radius:var(--ax-radius-xl);padding:var(--ax-space-8);display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--ax-space-5);">

        <!-- signed-out glyph -->
        <span aria-hidden="true" style="display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--ax-accent-wash);color:var(--ax-accent);">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/><path d="M9 12h12l-3 -3"/><path d="M18 15l3 -3"/></svg>
        </span>

        <h1 style="margin:0;font-family:var(--ax-font-display);font-weight:600;font-size:var(--ax-text-2xl);color:var(--ax-text-strong);">
          You've signed out
        </h1>
        <p style="margin:0;font-size:var(--ax-text-md);color:var(--ax-text-muted);line-height:1.55;">
          Your session on this device has ended securely. Sign back in any time to return to your workspace.

        <!-- who just signed out -->
        <div style="display:flex;align-items:center;gap:var(--ax-space-3);padding:var(--ax-space-3) var(--ax-space-4);width:100%;background:var(--ax-surface-subtle);border:1px solid var(--ax-border);border-radius:var(--ax-radius-md);text-align:start;">
          <span class="ax-avatar ax-avatar--squircle" style="background:color-mix(in oklab, var(--ax-viz-violet) 18%, transparent);color:var(--ax-viz-violet);flex:0 0 auto;">
            <span style="font-weight:var(--ax-weight-semibold);">DO</span>
          </span>
          <div style="min-width:0;">
            <div style="font-weight:var(--ax-weight-medium);color:var(--ax-text-strong);" class="ax-text-truncate">Devon Okafor</div>
            <div style="font-size:var(--ax-text-xs);color:var(--ax-text-subtle);" class="ax-text-truncate">devon@vireo.io</div>
          </div>
          <span class="ax-badge ax-badge--soft ax-badge--success ax-badge--pill" style="margin-inline-start:auto;flex:0 0 auto;">
            <span class="ax-badge__dot"></span>Secure
          </span>
        </div>

        <!-- actions -->
        <div style="display:flex;flex-direction:column;gap:var(--ax-space-3);width:100%;">
          <a class="ax-btn ax-btn--primary ax-btn--block" href="/src/html/auth/sign-in-basic.html">
            <svg class="ax-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/><path d="M21 12h-13l3 -3"/><path d="M11 15l-3 -3"/></svg>
            <span class="ax-btn__label">Sign in again</span>
          </a>
          <a class="ax-btn ax-btn--secondary ax-btn--block" href="/src/html/index.html">
            <svg class="ax-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></svg>
            <span class="ax-btn__label">Back to home</span>
          </a>
        </div>

        <!-- auto-redirect note -->
        <p style="margin:0;font-size:var(--ax-text-sm);color:var(--ax-text-subtle);" aria-live="polite">
          Redirecting to sign in in <b class="ax-num" style="font-family:var(--ax-font-mono);color:var(--ax-text);" x-text="seconds"></b> seconds…
          <button type="button" class="ax-btn ax-btn--link ax-btn--sm" @click="cancel()" x-show="!cancelled" style="padding:0;min-height:auto;">Stay here</button>
          <span x-show="cancelled" x-cloak style="color:var(--ax-text-subtle);">Auto-redirect cancelled.</span>
        </p>
      </div>

      <p style="margin:0;font-size:var(--ax-text-sm);color:var(--ax-text-subtle);text-align:center;">
        Not you? <a class="ax-link" href="/src/html/auth/sign-in-basic.html">Sign in as another user</a>
      </p>
    </div>
  </main>

  <!-- ============================================================ -->
  <!-- CMS RUNTIME — single ES module entry.                      -->
  <!-- Boots Alpine + plugins, registers shell components           -->
  <!-- (axShell, axSidebar, axHeader, axDropdown, axCommand,        -->
  <!-- axCustomizer), fetches /src/data/nav-manifest.json, and      -->
  <!-- wires active-trail, breadcrumb, command palette, theme.      -->
  <!-- ============================================================ -->
  
  <!-- Per-page hook (optional):
       Pages that need extra behavior (charts, datatables, editors) add a
       deferred module AFTER this line, e.g.:
       <script type="module" src="/src/js/pages/dashboards-sales.js"></script>
       Keep page scripts deferred/module so they run after vireo.js boots. -->
  <script>
    function logoutScreen() {
      return {
        seconds: 10,
        cancelled: false,
        _timer: null,
        init() {
          const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          this._timer = setInterval(() => {
            if (this.cancelled) return;
            this.seconds -= 1;
            if (this.seconds <= 0) {
              clearInterval(this._timer);
              window.location.href = '/src/html/auth/sign-in-basic.html';
            }
          }, 1000);
        },
        cancel() { this.cancelled = true; clearInterval(this._timer); },
      };
    }
  </script>
